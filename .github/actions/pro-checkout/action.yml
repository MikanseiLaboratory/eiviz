name: Checkout eiviz-pro
description: Replace pro/ with the private Pro module
inputs:
  token:
    description: GitHub token with read access to MikanseiLaboratory/eiviz-pro
    required: true
runs:
  using: composite
  steps:
    - name: Remove the Free stand-in
      shell: bash
      run: rm -rf pro
    - name: Checkout private Pro module
      uses: actions/checkout@v7
      with:
        repository: MikanseiLaboratory/eiviz-pro
        ref: main
        token: ${{ inputs.token }}
        path: pro
