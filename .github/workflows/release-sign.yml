name: keyed-release-packaging

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native package to build and sign
        type: choice
        options:
          - windows-x86_64
          - macos-aarch64
          - linux-x86_64
        required: true
      acknowledge_keyed_signing:
        description: I acknowledge this uses release signing/notarization keys
        type: boolean
        required: true
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/src -Dwarnings

jobs:
  windows:
    if: inputs.target == 'windows-x86_64' && inputs.acknowledge_keyed_signing
    runs-on: windows-latest
    environment: release-signing
    env:
      WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
      WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      WINDOWS_PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: signed-package-windows-x86_64
      - name: Require Windows release identity
        shell: pwsh
        run: |
          foreach ($name in @("WINDOWS_PFX_BASE64", "WINDOWS_PFX_PASSWORD", "WINDOWS_PUBLISHER")) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) {
              throw "Required release-signing secret $name is unavailable"
            }
          }
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx -or -not $signtool) { throw "Windows SDK signing tools not found" }
          $makeappx.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
          $signtool.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\eiviz-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
      - name: Resolve build evidence
        id: profile
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "features=$(python3 -c 'import json; print(\",\".join(json.load(open(\"packaging/release.json\"))[\"targets\"][\"windows-x86_64\"][\"features\"]))')" >> "$GITHUB_OUTPUT"
          python3 scripts/generate-third-party-notices.py
          python3 scripts/generate-sbom.py
      - name: Build Windows native profile
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc -p eiviz-desktop --features "${{ steps.profile.outputs.features }}"
          cargo build --locked --release --target x86_64-pc-windows-msvc -p eiviz-project --bin eiviz-project-migrate
      - name: Package and Authenticode-sign MSIX
        shell: pwsh
        run: |
          python3 scripts/build-package.py --target windows-x86_64 `
            --binary target/x86_64-pc-windows-msvc/release/eiviz-desktop.exe `
            --project-migrator target/x86_64-pc-windows-msvc/release/eiviz-project-migrate.exe `
            --msix-publisher "$env:WINDOWS_PUBLISHER"
          $unsigned = Get-ChildItem target/packages/*-unsigned.msix
          $signed = $unsigned.FullName.Replace("-unsigned.msix", ".msix")
          Move-Item $unsigned.FullName $signed
          signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f "$env:RUNNER_TEMP\eiviz-signing.pfx" /p "$env:WINDOWS_PFX_PASSWORD" $signed
          Remove-Item "$env:RUNNER_TEMP\eiviz-signing.pfx"
          python3 scripts/write-release-manifest.py --target windows-x86_64 `
            --artifact $signed --output target/packages/windows-x86_64.release.json
          python3 scripts/verify-signature.py --target windows-x86_64 `
            --artifact $signed --manifest target/packages/windows-x86_64.release.json
      - uses: actions/upload-artifact@v4
        with:
          name: eiviz-windows-x86_64-signed
          path: |
            target/packages/*.msix
            target/packages/*.release.json
          if-no-files-found: error

  macos:
    if: inputs.target == 'macos-aarch64' && inputs.acknowledge_keyed_signing
    runs-on: macos-14
    environment: release-signing
    env:
      MACOS_CERTIFICATES_P12_BASE64: ${{ secrets.MACOS_CERTIFICATES_P12_BASE64 }}
      MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
      MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
      MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: signed-package-macos-aarch64
      - name: Require and import Apple release identities
        shell: bash
        run: |
          for name in MACOS_CERTIFICATES_P12_BASE64 MACOS_CERTIFICATES_PASSWORD \
            MACOS_APPLICATION_IDENTITY MACOS_INSTALLER_IDENTITY APPLE_ID \
            APPLE_APP_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name:-}" || { echo "::error::Required release-signing secret $name is unavailable"; exit 1; }
          done
          keychain="$RUNNER_TEMP/eiviz-signing.keychain-db"
          password="$(openssl rand -hex 24)"
          echo "$keychain" >> "$GITHUB_PATH"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$MACOS_CERTIFICATES_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/eiviz-signing.p12"
          security import "$RUNNER_TEMP/eiviz-signing.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATES_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -d user -s "$keychain"
          rm "$RUNNER_TEMP/eiviz-signing.p12"
      - name: Resolve build evidence
        id: profile
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "features=$(python3 -c 'import json; print(\",\".join(json.load(open(\"packaging/release.json\"))[\"targets\"][\"macos-aarch64\"][\"features\"]))')" >> "$GITHUB_OUTPUT"
          python3 scripts/generate-third-party-notices.py
          python3 scripts/generate-sbom.py
      - name: Build macOS native profile
        run: |
          cargo build --locked --release --target aarch64-apple-darwin -p eiviz-desktop --features "${{ steps.profile.outputs.features }}"
          cargo build --locked --release --target aarch64-apple-darwin -p eiviz-project --bin eiviz-project-migrate
      - name: Sign app, installer, and notarize
        shell: bash
        run: |
          python3 scripts/build-package.py --target macos-aarch64 \
            --binary target/aarch64-apple-darwin/release/eiviz-desktop \
            --project-migrator target/aarch64-apple-darwin/release/eiviz-project-migrate
          app=target/package-stage/macos-aarch64/eiviz.app
          codesign --force --deep --strict --options runtime --timestamp \
            --sign "$MACOS_APPLICATION_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          rm target/packages/*-unsigned.pkg
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["workspace"]["package"]["version"])')"
          package="target/packages/eiviz-${version}-macos-aarch64.pkg"
          pkgbuild --component "$app" --install-location /Applications \
            --identifier com.mikanseilaboratory.eiviz --version "$version" \
            --sign "$MACOS_INSTALLER_IDENTITY" "$package"
          xcrun notarytool submit "$package" --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$package"
          python3 scripts/write-release-manifest.py --target macos-aarch64 \
            --artifact "$package" --output target/packages/macos-aarch64.release.json
          python3 scripts/verify-signature.py --target macos-aarch64 \
            --artifact "$package" --manifest target/packages/macos-aarch64.release.json \
            --assess-notarization
      - uses: actions/upload-artifact@v4
        with:
          name: eiviz-macos-aarch64-signed-notarized
          path: |
            target/packages/*.pkg
            target/packages/*.release.json
          if-no-files-found: error

  linux:
    if: inputs.target == 'linux-x86_64' && inputs.acknowledge_keyed_signing
    runs-on: ubuntu-24.04
    environment: release-signing
    env:
      LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
      LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
      LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: signed-package-linux-x86_64
      - name: Install Linux native build and package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libasound2-dev libudev-dev libx11-dev \
            libxrandr-dev libxi-dev libxcursor-dev libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libvulkan-dev
      - name: Require and import Linux release identity
        shell: bash
        run: |
          for name in LINUX_GPG_PRIVATE_KEY LINUX_GPG_KEY_ID; do
            test -n "${!name:-}" || { echo "::error::Required release-signing secret $name is unavailable"; exit 1; }
          done
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Resolve build evidence
        id: profile
        shell: bash
        run: |
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          echo "features=$(python3 -c 'import json; print(\",\".join(json.load(open(\"packaging/release.json\"))[\"targets\"][\"linux-x86_64\"][\"features\"]))')" >> "$GITHUB_OUTPUT"
          python3 scripts/generate-third-party-notices.py
          python3 scripts/generate-sbom.py
      - name: Build Linux native profile
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-gnu -p eiviz-desktop --features "${{ steps.profile.outputs.features }}"
          cargo build --locked --release --target x86_64-unknown-linux-gnu -p eiviz-project --bin eiviz-project-migrate
      - name: Package and create detached OpenPGP signature
        shell: bash
        run: |
          python3 scripts/build-package.py --target linux-x86_64 \
            --binary target/x86_64-unknown-linux-gnu/release/eiviz-desktop \
            --project-migrator target/x86_64-unknown-linux-gnu/release/eiviz-project-migrate
          unsigned="$(python3 -c 'from pathlib import Path; print(next(Path("target/packages").glob("*_unsigned.deb")))')"
          package="${unsigned/_unsigned.deb/.deb}"
          mv "$unsigned" "$package"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$LINUX_GPG_PASSPHRASE" --local-user "$LINUX_GPG_KEY_ID" \
            --armor --detach-sign "$package"
          python3 scripts/write-release-manifest.py --target linux-x86_64 \
            --artifact "$package" --signature "$package.asc" \
            --output target/packages/linux-x86_64.release.json
          python3 scripts/verify-signature.py --target linux-x86_64 \
            --artifact "$package" --signature "$package.asc" \
            --manifest target/packages/linux-x86_64.release.json
      - uses: actions/upload-artifact@v4
        with:
          name: eiviz-linux-x86_64-signed
          path: |
            target/packages/*.deb
            target/packages/*.asc
            target/packages/*.release.json
          if-no-files-found: error
