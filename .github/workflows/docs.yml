# Official docs site (Starlight) → GitHub Pages.
# Public URL: https://mikanseilaboratory.github.io/eiviz/
#
# Path filters skip this workflow when docs did not change.
# Do not keep "Build docs" as a required check: a skipped workflow stays
# Pending and blocks the merge.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Latest release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1" --jq '.[0].tag_name // empty')
          echo "PUBLIC_EIVIZ_VERSION=$tag" >> "$GITHUB_ENV"

      - name: Install, build, and upload
        uses: withastro/action@v6
        with:
          path: docs
          node-version: 22
        env:
          PUBLIC_EIVIZ_VERSION: ${{ env.PUBLIC_EIVIZ_VERSION }}
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
