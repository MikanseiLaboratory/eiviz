# Official docs site (Starlight) → GitHub Pages.
# Public URL: https://mikanseilaboratory.github.io/eiviz/
#
# "Build docs" is a required check. Do not put `paths:` on `on:` — a skipped
# workflow stays Pending and still blocks the merge. The job always reports
# success; the Astro build runs only when docs/ (or this file) changed.
name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.docs.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect docs changes
        id: docs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          changed=false
          case "$EVENT_NAME" in
            workflow_dispatch)
              changed=true
              ;;
            pull_request)
              if git diff --name-only "$PR_BASE" "$GITHUB_SHA" | grep -qE '^(docs/|\.github/workflows/docs\.yml$)'; then
                changed=true
              fi
              ;;
            push)
              if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                changed=true
              elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(docs/|\.github/workflows/docs\.yml$)'; then
                changed=true
              fi
              ;;
            *)
              changed=true
              ;;
          esac
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "docs changed: $changed"

      - name: Latest release tag
        if: steps.docs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=1" --jq '.[0].tag_name // empty')
          echo "PUBLIC_EIVIZ_VERSION=$tag" >> "$GITHUB_ENV"

      - name: Install, build, and upload
        if: steps.docs.outputs.changed == 'true'
        uses: withastro/action@v6
        with:
          path: docs
          node-version: 22
        env:
          PUBLIC_EIVIZ_VERSION: ${{ env.PUBLIC_EIVIZ_VERSION }}
          GITHUB_TOKEN: ${{ github.token }}

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.changed == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
