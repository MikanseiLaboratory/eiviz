# GitHub Releases for version tags. See #10.
#   v1.2.3           -> Release
#   v1.2.3-alpha.1   -> Pre-release
#   v1.2.3-beta.1    -> Pre-release
#   v1.2.3-rc.1      -> Pre-release
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.0.0-alpha.1)"
        required: true

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NDI_SDK_URL: https://downloads.ndi.tv/SDK/NDI_SDK/NDI%206%20SDK.exe
  NDI_SDK_URL_MACOS: https://downloads.ndi.tv/SDK/NDI_SDK_Mac/Install_NDI_SDK_v6_Apple.pkg
  LLVM_VERSION: "20.1.8"

jobs:
  meta:
    name: Resolve tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      base: ${{ steps.meta.outputs.base }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Resolve tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_NAME"
          fi
          TAG="${TAG#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)([.-].*)?)?$ ]]; then
            echo "Unsupported tag '$TAG'. Expected vX.Y.Z or vX.Y.Z-(alpha|beta|rc)[...]" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          BASE="${VERSION%%-*}"
          if [[ "$TAG" =~ -(alpha|beta|rc)([.-]|$) ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved $TAG (assembly $BASE, prerelease=$PRERELEASE)"

  windows-x64:
    name: Release Windows x64
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup NDI SDK and LLVM
        uses: ./.github/actions/setup-ndi-windows

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mixer

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test mixer
        working-directory: mixer
        run: cargo test --locked --release -- --test-threads=1

      - name: Publish host (win-x64)
        run: |
          dotnet publish host\Eiviz.Host.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o "${{ github.workspace }}\publish\win-x64" `
            -p:Version=${{ needs.meta.outputs.base }} `
            -p:InformationalVersion=${{ needs.meta.outputs.version }}
          if (-not (Test-Path "${{ github.workspace }}\publish\win-x64\Eiviz.Host.exe")) {
            throw "Published output is missing Eiviz.Host.exe"
          }
          if (-not (Test-Path "${{ github.workspace }}\publish\win-x64\eiviz_mixer.dll")) {
            throw "Published output is missing eiviz_mixer.dll"
          }
          if (-not (Test-Path "${{ github.workspace }}\publish\win-x64\Processing.NDI.Lib.x64.dll")) {
            throw "Published output is missing Processing.NDI.Lib.x64.dll"
          }

      - name: Package zip
        shell: bash
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          STAGING="eiviz-${TAG}-win-x64"
          mkdir -p "$STAGING"
          cp -a publish/win-x64/. "$STAGING/"
          7z a -tzip "${STAGING}.zip" "$STAGING"
          sha256sum "${STAGING}.zip" | tee "${STAGING}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: win-x64
          path: |
            eiviz-${{ needs.meta.outputs.tag }}-win-x64.zip
            eiviz-${{ needs.meta.outputs.tag }}-win-x64.zip.sha256

  macos-arm64:
    name: Release macOS arm64
    needs: meta
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup NDI SDK
        uses: ./.github/actions/setup-ndi-macos

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mixer

      - name: Test mixer
        working-directory: mixer
        run: cargo test --locked --release -- --test-threads=1

      - name: Build Mac host
        run: |
          chmod +x mac/build.sh
          mac/build.sh

      - name: Package zip
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          STAGING="eiviz-${TAG}-macos-arm64"
          BIN="$(cd mac && swift build -c release --show-bin-path)"
          mkdir -p "$STAGING"
          cp "$BIN/eiviz-mac" "$STAGING/"
          cp "$BIN/libeiviz_mixer.dylib" "$STAGING/"
          if [ -f "$BIN/libndi.dylib" ]; then
            cp "$BIN/libndi.dylib" "$STAGING/"
          fi
          if [ -f "$BIN/libndi.6.dylib" ]; then
            cp "$BIN/libndi.6.dylib" "$STAGING/"
          fi
          chmod +x mac/relocate-dylib.sh mac/package-app.sh
          mac/relocate-dylib.sh "$STAGING/eiviz-mac" "$STAGING/libeiviz_mixer.dylib"
          mac/package-app.sh "$STAGING"
          codesign --force --sign - --timestamp=none "$STAGING/libeiviz_mixer.dylib"
          if [ -f "$STAGING/libndi.dylib" ]; then
            codesign --force --sign - --timestamp=none "$STAGING/libndi.dylib"
          fi
          if [ -f "$STAGING/libndi.6.dylib" ]; then
            codesign --force --sign - --timestamp=none "$STAGING/libndi.6.dylib"
          fi
          codesign --force --sign - --timestamp=none "$STAGING/eiviz-mac"
          codesign --force --sign - --timestamp=none --deep "$STAGING/eiviz-mac.app"
          cat > "$STAGING/HOW_TO_RUN.txt" <<'EOF'
          Apple Silicon (arm64) Metal preview host.

          Unzip, then in Terminal:
            cd eiviz-*-macos-arm64
            xattr -cr .
            open eiviz-mac.app

          The .app bundle is required for NDI® discovery/send (local network + Bonjour).
          The loose ./eiviz-mac binary still works for local preview.

          Optional still image on Scene 2:
            ./eiviz-mac /path/to/image.png

          If macOS blocks the binary: System Settings → Privacy & Security → Open Anyway.
          CUT, AUTO, T-bar, and OMT Program send (name eiviz-mac) are available.
          EOF
          zip -r "${STAGING}.zip" "$STAGING"
          shasum -a 256 "${STAGING}.zip" | tee "${STAGING}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64
          path: |
            eiviz-${{ needs.meta.outputs.tag }}-macos-arm64.zip
            eiviz-${{ needs.meta.outputs.tag }}-macos-arm64.zip.sha256

  macos-x64:
    name: Release macOS x64
    needs: meta
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup NDI SDK
        uses: ./.github/actions/setup-ndi-macos

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mixer
          key: macos-x64

      - name: Build Mac host (x86_64)
        env:
          EIVIZ_MAC_ARCH: x86_64-apple-darwin
        run: |
          chmod +x mac/build.sh
          mac/build.sh
          BIN="$(cd mac && swift build -c release --arch x86_64 --show-bin-path)"
          file "$BIN/eiviz-mac" | grep -E "x86_64|i386"

      - name: Package zip
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          STAGING="eiviz-${TAG}-macos-x64"
          BIN="$(cd mac && swift build -c release --arch x86_64 --show-bin-path)"
          mkdir -p "$STAGING"
          cp "$BIN/eiviz-mac" "$STAGING/"
          cp "$BIN/libeiviz_mixer.dylib" "$STAGING/"
          if [ -f "$BIN/libndi.dylib" ]; then
            cp "$BIN/libndi.dylib" "$STAGING/"
          fi
          if [ -f "$BIN/libndi.6.dylib" ]; then
            cp "$BIN/libndi.6.dylib" "$STAGING/"
          fi
          chmod +x mac/relocate-dylib.sh mac/package-app.sh
          mac/relocate-dylib.sh "$STAGING/eiviz-mac" "$STAGING/libeiviz_mixer.dylib"
          mac/package-app.sh "$STAGING"
          codesign --force --sign - --timestamp=none "$STAGING/libeiviz_mixer.dylib"
          if [ -f "$STAGING/libndi.dylib" ]; then
            codesign --force --sign - --timestamp=none "$STAGING/libndi.dylib"
          fi
          if [ -f "$STAGING/libndi.6.dylib" ]; then
            codesign --force --sign - --timestamp=none "$STAGING/libndi.6.dylib"
          fi
          codesign --force --sign - --timestamp=none "$STAGING/eiviz-mac"
          codesign --force --sign - --timestamp=none --deep "$STAGING/eiviz-mac.app"
          cat > "$STAGING/HOW_TO_RUN.txt" <<'EOF'
          Intel (x86_64 / amd64) Metal preview host.

          Unzip, then in Terminal:
            cd eiviz-*-macos-x64
            xattr -cr .
            open eiviz-mac.app

          The .app bundle is required for NDI® discovery/send (local network + Bonjour).
          The loose ./eiviz-mac binary still works for local preview.

          Optional still image on Scene 2:
            ./eiviz-mac /path/to/image.png

          If macOS blocks the binary: System Settings → Privacy & Security → Open Anyway.
          CUT, AUTO, T-bar, and OMT Program send (name eiviz-mac) are available.
          EOF
          zip -r "${STAGING}.zip" "$STAGING"
          shasum -a 256 "${STAGING}.zip" | tee "${STAGING}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64
          path: |
            eiviz-${{ needs.meta.outputs.tag }}-macos-x64.zip
            eiviz-${{ needs.meta.outputs.tag }}-macos-x64.zip.sha256

  publish:
    name: Publish GitHub Release
    needs: [meta, windows-x64, macos-arm64, macos-x64]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.tag }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.meta.outputs.prerelease != 'true' }}
          generate_release_notes: true
          files: |
            dist/eiviz-${{ needs.meta.outputs.tag }}-win-x64.zip
            dist/eiviz-${{ needs.meta.outputs.tag }}-win-x64.zip.sha256
            dist/eiviz-${{ needs.meta.outputs.tag }}-macos-arm64.zip
            dist/eiviz-${{ needs.meta.outputs.tag }}-macos-arm64.zip.sha256
            dist/eiviz-${{ needs.meta.outputs.tag }}-macos-x64.zip
            dist/eiviz-${{ needs.meta.outputs.tag }}-macos-x64.zip.sha256
