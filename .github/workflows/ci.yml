name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - name: Linux windowing deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev
      - name: workspace MSRV
        run: cargo check --workspace

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux windowing deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test default profile
        run: cargo test --workspace
      - name: test hardware GPU feature wiring
        run: cargo test -p eiviz-gpu --features wgpu-backend
      - name: verify desktop wgpu version singleton
        run: cargo tree -p eiviz-desktop --features wgpu-backend -i wgpu
      - name: check desktop GPU feature wiring
        run: cargo check -p eiviz-desktop --features wgpu-backend
