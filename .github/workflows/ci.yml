# Windows x64 CI (first supported target). See #10.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NDI_SDK_URL: https://downloads.ndi.tv/SDK/NDI_SDK/NDI%206%20SDK.exe
  NDI_SDK_URL_MACOS: https://downloads.ndi.tv/SDK/NDI_SDK_Mac/Install_NDI_SDK_v6_Apple.pkg
  LLVM_VERSION: "20.1.8"

jobs:
  windows-x64:
    name: Test and build (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup NDI SDK and LLVM
        uses: ./.github/actions/setup-ndi-windows

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test mixer
        # mixer_create is process-global, so GPU/integration tests cannot share the process.
        run: cargo test -p eiviz_mixer --locked --release -- --test-threads=1

      - name: Build headless
        run: cargo build -p eiviz-headless --locked --release --bins

      - name: Validate sample session
        run: .\target\release\eiviz-headless.exe validate --session headless\tests\fixtures\bars.eiviz.json

      - name: Build host
        run: dotnet build eiviz.slnx -c Release

  macos:
    name: Test mixer and Mac host
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup NDI SDK
        uses: ./.github/actions/setup-ndi-macos

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Test mixer
        # mixer_create is process-global, so GPU/integration tests cannot share the process.
        run: cargo test -p eiviz_mixer --locked --release -- --test-threads=1

      - name: Build headless
        run: cargo build -p eiviz-headless --locked --release --bins

      - name: Validate sample session
        run: ./target/release/eiviz-headless validate --session headless/tests/fixtures/bars.eiviz.json

      - name: Build Mac host
        run: |
          chmod +x mac/build.sh
          mac/build.sh

  control-api:
    name: Control and API (Ubuntu, no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Format control API
        run: cargo fmt -p eiviz-control -p eiviz-api -p eiviz-headless -- --check

      - name: Clippy control API
        run: cargo clippy -p eiviz-control -p eiviz-api -p eiviz-headless --locked --no-default-features -- -D warnings

      - name: Test control and API
        run: cargo test -p eiviz-control -p eiviz-api -p eiviz-headless --locked --no-default-features

      - name: Build eivizctl and headless without GPU
        run: cargo build -p eiviz-headless --locked --bins --no-default-features

      - name: Validate sample session
        run: ./target/debug/eiviz-headless validate --session headless/tests/fixtures/bars.eiviz.json
