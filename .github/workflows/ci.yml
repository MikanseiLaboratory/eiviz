# Windows x64 CI (first supported target). See #10.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  NDI_SDK_URL: https://downloads.ndi.tv/SDK/NDI_SDK/NDI%206%20SDK.exe
  NDI_SDK_URL_MACOS: https://downloads.ndi.tv/SDK/NDI_SDK_Mac/Install_NDI_SDK_v6_Apple.pkg
  LLVM_VERSION: "20.1.8"

jobs:
  windows-x64:
    name: Test and build (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup NDI SDK and LLVM
        uses: ./.github/actions/setup-ndi-windows

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Test mixer
        # mixer_create is process-global, so GPU/integration tests cannot share the process.
        run: cargo test -p eiviz_mixer --locked --release -- --test-threads=1

      - name: Build headless
        run: cargo build -p eiviz-headless --locked --release --bins

      - name: Validate sample session
        run: .\target\release\eiviz-headless.exe validate --session headless\tests\fixtures\bars.eivz

      # windows-latest exposes WARP/DX12, not a Vulkan adapter. Vulkan exit is linux-vulkan.
      - name: Run headless Bars session and confirm process exit
        shell: pwsh
        run: |
          $out = Join-Path $env:TEMP "eiviz-headless-ci.out.log"
          $err = Join-Path $env:TEMP "eiviz-headless-ci.err.log"
          Remove-Item $out, $err -ErrorAction SilentlyContinue
          function Read-SharedLog([string] $path) {
            if (-not (Test-Path $path)) { return "" }
            $stream = [IO.File]::Open($path, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::ReadWrite)
            try {
              $reader = New-Object IO.StreamReader($stream)
              $reader.ReadToEnd()
            } finally {
              $stream.Dispose()
            }
          }
          function Combined-Log { "$(Read-SharedLog $out)$(Read-SharedLog $err)" }
          $proc = Start-Process -FilePath ".\target\release\eiviz-headless.exe" -ArgumentList @(
            "run",
            "--session", "headless\tests\fixtures\bars.eivz",
            "--bind", "127.0.0.1:0",
            "--renderer", "dx12"
          ) -RedirectStandardOutput $out -RedirectStandardError $err -PassThru -NoNewWindow
          $ready = $false
          $ws = $null
          for ($i = 0; $i -lt 40; $i++) {
            $text = Combined-Log
            if ($text -match "eiviz-headless ready ws=([^\s]+)") {
              $ready = $true
              $ws = $Matches[1]
              break
            }
            if ($proc.HasExited) {
              Write-Output (Combined-Log)
              throw "headless exited before ready (status=$($proc.ExitCode))"
            }
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Write-Output (Combined-Log)
            throw "headless did not become ready"
          }
          & .\target\release\eivizctl.exe --url "ws://$ws" shutdown
          if (-not $proc.WaitForExit(15000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Write-Output (Combined-Log)
            throw "headless still running after shutdown"
          }
          Write-Output (Combined-Log)
          if ($proc.ExitCode -ne 0) {
            throw "headless exited with $($proc.ExitCode)"
          }

      - name: Build host
        run: dotnet build eiviz.slnx -c Release

  macos:
    name: Test mixer and Mac host
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup NDI SDK
        uses: ./.github/actions/setup-ndi-macos

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Test mixer
        # mixer_create is process-global, so GPU/integration tests cannot share the process.
        run: cargo test -p eiviz_mixer --locked --release -- --test-threads=1

      - name: Build headless
        run: cargo build -p eiviz-headless --locked --release --bins

      - name: Validate sample session
        run: ./target/release/eiviz-headless validate --session headless/tests/fixtures/bars.eivz

      - name: Build Mac host
        run: |
          chmod +x hosts/macos/build.sh
          hosts/macos/build.sh

  control-api:
    name: Control and API (Ubuntu, no GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Format control API
        run: cargo fmt -p eiviz-control -p eiviz-api -p eiviz_remote -p eiviz-headless -- --check

      - name: Clippy control API
        run: cargo clippy -p eiviz-control -p eiviz-api -p eiviz_remote -p eiviz-headless --locked --no-default-features -- -D warnings

      - name: Test control and API
        run: cargo test -p eiviz-control -p eiviz-api -p eiviz_remote -p eiviz-headless --locked --no-default-features

      - name: Build eivizctl and headless without GPU
        run: cargo build -p eiviz-headless --locked --bins --no-default-features

      - name: Validate sample session
        run: |
          ./target/debug/eiviz-headless validate --session headless/tests/fixtures/bars.eivz
          ./target/debug/eiviz-headless canonicalize --session headless/tests/fixtures/bars.eivz > /tmp/bars.canonical.json

  linux-vulkan:
    name: Headless Vulkan (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Mesa Vulkan (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools libvulkan1
          if [ -f /usr/share/vulkan/icd.d/lvp_icd.x86_64.json ]; then
            echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" >> "$GITHUB_ENV"
            echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json" >> "$GITHUB_ENV"
          elif [ -f /usr/share/vulkan/icd.d/lvp_icd.json ]; then
            echo "VK_DRIVER_FILES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
            echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
          else
            echo "Lavapipe ICD not found" >&2
            ls -l /usr/share/vulkan/icd.d || true
            exit 1
          fi

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Confirm Vulkan adapter
        run: vulkaninfo --summary

      - name: Test mixer backend and headless compose
        # mixer_create is process-global, so GPU tests cannot share the process.
        run: |
          cargo test -p eiviz_mixer --locked --release --lib selected_backend -- --test-threads=1
          cargo test -p eiviz_mixer --locked --release --test pipeline ping_and_invalid_clock -- --test-threads=1 --exact
          cargo test -p eiviz_mixer --locked --release --test pipeline rebar_info_and_toggle -- --test-threads=1 --exact
          cargo test -p eiviz_mixer --locked --release --test pipeline snapshot_writes_png -- --test-threads=1 --exact
          cargo test -p eiviz_mixer --locked --release --test pipeline scene_compose_overlay_after_mix_multiview_and_tbar_take -- --test-threads=1 --exact
          cargo test -p eiviz_mixer --locked --release --test pipeline vulkan_backend_is_explicit -- --test-threads=1 --exact

      - name: Build headless
        run: cargo build -p eiviz-headless --locked --release --bins

      - name: Validate sample session
        run: ./target/release/eiviz-headless validate --session headless/tests/fixtures/bars.eivz

      - name: Run headless Bars session on Vulkan
        run: |
          set -euo pipefail
          ./target/release/eiviz-headless run \
            --session headless/tests/fixtures/bars.eivz \
            --bind 127.0.0.1:0 > /tmp/eiviz-headless.log 2>&1 &
          pid=$!
          for _ in $(seq 1 40); do
            if grep -q "eiviz-headless ready ws=" /tmp/eiviz-headless.log; then
              kill -TERM "$pid"
              set +e
              wait "$pid"
              status=$?
              set -e
              cat /tmp/eiviz-headless.log
              if [ "$status" -ne 0 ]; then
                echo "headless exited with $status after SIGTERM"
                exit "$status"
              fi
              exit 0
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" || status=$?
              echo "headless exited before ready (status=${status:-0})"
              cat /tmp/eiviz-headless.log
              exit "${status:-1}"
            fi
            sleep 1
          done
          echo "headless did not become ready"
          kill -TERM "$pid" || true
          wait "$pid" || true
          cat /tmp/eiviz-headless.log
          exit 1
