name: Pro module

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows-x64:
    name: Test Pro module (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout private Pro module
        uses: ./.github/actions/pro-checkout
        with:
          token: ${{ secrets.EIVIZ_PRO_TOKEN }}

      - name: Install Rust 1.97
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Test Free, Professional, and Enterprise
        shell: bash
        run: |
          cargo test -p eiviz_pro --features pro-dev -- --test-threads=1
          EIVIZ_PLAN=professional cargo test -p eiviz_pro --features pro-dev -- --test-threads=1
          EIVIZ_PLAN=enterprise cargo test -p eiviz_pro --features pro-dev -- --test-threads=1
