[package]
name = "eiviz-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "eiviz native GUI"
default-run = "eiviz-desktop"

[dependencies]
eiviz-command.workspace = true
eiviz-control.workspace = true
eiviz-core.workspace = true
eiviz-engine.workspace = true
eiviz-gpu = { workspace = true, optional = true }
eiviz-media.workspace = true
eiviz-operations.workspace = true
eiviz-project.workspace = true
eiviz-io-file.workspace = true
eiviz-io-audio.workspace = true
eiviz-io-decklink.workspace = true
eiviz-io-ndi.workspace = true
eiviz-io-omt.workspace = true
eframe.workspace = true
egui.workspace = true
# egui-wgpu 0.32 disables wgpu default features (WGSL only). Desktop still
# creates an eframe wgpu Instance, so platform backends must be unified in.
wgpu.workspace = true
image.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = []
decklink = ["eiviz-io-decklink/decklink-sdk"]
ndi = ["eiviz-io-ndi/ndi", "eiviz-engine/ndi"]
wgpu-backend = ["eiviz-engine/wgpu-backend", "dep:eiviz-gpu"]
audio-cpal = ["eiviz-io-audio/cpal"]
audio-pipewire = ["audio-cpal", "eiviz-io-audio/pipewire"]
# Separate distribution profile: requires an operator-installed Steinberg ASIO SDK.
audio-asio = ["audio-cpal", "eiviz-io-audio/asio"]
midi = ["eiviz-control/midi"]

[dev-dependencies]
eiviz-codec-software.workspace = true
eiviz-io-stream.workspace = true
eiviz-time.workspace = true
