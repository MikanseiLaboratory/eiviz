[package]
name = "eiviz-headless"
version = "0.3.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Headless eiviz daemon and eivizctl client"

[[bin]]
name = "eiviz-headless"
path = "src/bin/eiviz-headless.rs"

[[bin]]
name = "eivizctl"
path = "src/bin/eivizctl.rs"

[dependencies]
eiviz-api.workspace = true
eiviz-control.workspace = true
eiviz_mixer = { workspace = true, optional = true }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[features]
default = ["runtime"]
runtime = ["dep:eiviz_mixer"]
