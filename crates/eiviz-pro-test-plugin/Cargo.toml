[package]
name = "eiviz_pro_test_plugin"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Signed stand-in used to test the Pro module loader"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
eiviz-pro-api.workspace = true
# The test store hands the mixer real VMX1 packets so the GPU playback path can
# be exercised without the private Pro module.
vmx = { git = "https://github.com/MikanseiLaboratory/vmx-rs", rev = "b9a0fd19226e3e2ebf4041a2b119b855e71d9ca3", features = ["wgpu"] }
