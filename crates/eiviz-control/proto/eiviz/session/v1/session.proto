syntax = "proto3";

package eiviz.session.v1;

// On-disk session contract. Field numbers that have been published must never
// be reused. Delete by reserving the number and name. The wire file is
// magic "EIVZ" + little-endian u16 container version + this message.

message SessionFile {
  uint32 format_version = 1;
  Document document = 2;
  repeated EmbeddedAsset assets = 3;
  repeated HistoryEntry history = 4;
}

message EmbeddedAsset {
  uint64 input_id = 1;
  string file_name = 2;
  bytes data = 3;
}

message HistoryEntry {
  uint64 unix_ms = 1;
  uint64 revision = 2;
  bytes document = 3;
}

message Document {
  int32 version = 1;
  repeated SceneLayoutPreset scene_presets = 2;
  repeated string input_tags = 3;
  repeated string scene_tags = 4;
  SessionSettings settings = 5;
  repeated Input inputs = 6;
  repeated Scene scenes = 7;
  repeated MixingUnit units = 8;
  repeated TransitionPreset transitions = 20;
  repeated OverlaySlot overlays = 21;
  uint64 next_overlay_id = 22;
  repeated Output outputs = 9;
  repeated Multiview multiviews = 10;
  reserved 11, 17;
  reserved "buses", "next_bus_id";
  uint64 next_input_id = 12;
  uint64 next_scene_id = 13;
  uint64 next_unit_id = 14;
  uint64 next_output_id = 15;
  uint64 next_multiview_id = 16;
  uint64 selected_unit_id = 18;
  bool headphone_copy_monitor = 19;
  Headphone headphone = 23;
  uint32 headphone_listen_kind = 24;
  uint64 headphone_listen_id = 25;
  repeated StreamEncoder stream_encoders = 26;
  uint64 next_stream_encoder_id = 27;
  Replay replay = 28;
  repeated string replay_tags = 29;
}

message SessionSettings {
  uint32 master_fps_num = 1;
  uint32 master_fps_den = 2;
  uint32 default_width = 3;
  uint32 default_height = 4;
  string theme = 5;
  uint64 default_multiview_unit_id = 6;
  uint32 frame_buffer_frames = 7;
  uint32 default_present_interval = 8;
  uint32 flip_swapchain_limit = 9;
  // Presentation interval for the replay deck's monitors. Zero follows the default.
  uint32 replay_present_interval = 27;
  InternalColorFormat internal_color_format = 10;
  bool rebar_optimization = 11;
  bool rebar_direct_sample = 12;
  bool ndi_gpu_upload = 13;
  RgbColor preview_color = 14;
  RgbColor program_color = 15;
  RgbColor inactive_color = 16;
  float multiview_label_size = 17;
  MvLabelUnit multiview_label_unit = 18;
  MvLabelAnchor multiview_label_anchor = 19;
  bool vmix_api_enabled = 20;
  uint32 vmix_api_port = 21;
  string vmix_api_user = 22;
  string vmix_api_password = 23;
  bool vmix_tcp_enabled = 24;
  bool native_api_enabled = 25;
  uint32 native_api_port = 26;
}

message RgbColor {
  uint32 r = 1;
  uint32 g = 2;
  uint32 b = 3;
}

message Input {
  uint64 id = 1;
  string guid = 2;
  string name = 3;
  InputKind kind = 4;
  optional string path_or_address = 5;
  float color_r = 6;
  float color_g = 7;
  float color_b = 8;
  bool scroll = 9;
  float tone_hz = 10;
  float tone_level_dbfs = 11;
  reserved 12, 32;
  reserved "bus_mask", "mix_audio_bus_id";
  float gain = 13;
  bool mute = 14;
  bool use_gpu = 15;
  uint32 frame_buffer_frames = 16;
  BandwidthSave bandwidth_save = 17;
  bool keep_full_on_multiview = 18;
  OmtQuality omt_quality = 19;
  NdiBandwidth ndi_bandwidth = 20;
  bool video_loop = 21;
  VideoPlayWhen video_play_when = 22;
  VideoTriggerWhen video_restart_when = 23;
  VideoTriggerWhen video_pause_when = 24;
  uint32 capture_width = 25;
  uint32 capture_height = 26;
  uint32 capture_fps_num = 27;
  uint32 capture_fps_den = 28;
  repeated string tags = 29;
  MixSource mix_source = 30;
  uint64 mix_target_id = 31;
  AudioCaptureMode audio_capture_mode = 33;
  AudioDeviceKind audio_device_kind = 34;
  string audio_device_id = 35;
  int32 audio_map_left = 36;
  int32 audio_map_right = 37;
  string audio_process_exe = 38;
  string audio_process_aumid = 39;
  repeated uint64 audio_units = 40;
  string decklink_mode = 41;
}

message SceneLayer {
  uint64 input_id = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  float opacity = 6;
  int32 z = 7;
  bool audio_follow = 8;
  bool locked = 9;
  bool size_linked = 10;
  float crop_x = 11;
  float crop_y = 12;
  float crop_width = 13;
  float crop_height = 14;
  bool hidden = 15;
  uint64 layer_id = 16;
}

message Scene {
  uint64 id = 1;
  string guid = 2;
  string name = 3;
  repeated SceneLayer layers = 4;
  repeated string tags = 5;
  bool preview_collapsed = 6;
  repeated SceneState states = 7;
  repeated SceneSequence sequences = 8;
  SceneCamera camera = 9;
}

message SceneCamera {
  float x = 1;
  float y = 2;
  float zoom = 3;
}

message Motion {
  uint32 duration_frames = 1;
  uint32 easing = 2;
  optional BezierHandles bezier = 3;
}

message LayerKey {
  uint64 layer_id = 1;
  SceneLayerGeom geom = 2;
}

message SceneState {
  uint64 id = 1;
  string name = 2;
  repeated LayerKey layers = 3;
  Motion enter = 4;
  SceneCamera camera = 5;
}

message SequenceStep {
  uint64 state_id = 1;
  optional Motion motion = 2;
  uint32 hold_frames = 3;
  optional SequenceReplayAction replay = 4;
}

/// What an animation step does to Replay.
message SequenceReplayAction {
  uint32 channel = 1;
  /// Empty means the newest clip on the channel's playlist.
  string clip_uid = 2;
  bool play = 3;
}

message SceneSequence {
  uint64 id = 1;
  string name = 2;
  repeated SequenceStep steps = 3;
}

message SceneLayoutPreset {
  string name = 1;
  repeated SceneLayerGeom layers = 2;
}

message SceneLayerGeom {
  float x = 1;
  float y = 2;
  float width = 3;
  float height = 4;
  float opacity = 5;
  int32 z = 6;
  float crop_x = 7;
  float crop_y = 8;
  float crop_width = 9;
  float crop_height = 10;
}

message TransitionPreset {
  uint32 kind = 1;
  uint32 duration_value = 2;
  uint32 duration_unit = 3;
  bool swap = 4;
  bool keep_preview = 5;
  uint32 easing = 6;
  uint32 direction = 7;
  float dip_r = 8;
  float dip_g = 9;
  float dip_b = 10;
  float dip_a = 11;
  float softness = 12;
  float param = 13;
  optional string custom_wgsl = 14;
  optional string label = 15;
  optional BezierHandles bezier = 16;
}

message BezierHandles {
  float x1 = 1;
  float y1 = 2;
  float x2 = 3;
  float y2 = 4;
}

message OverlaySlot {
  uint64 scene_gpu_id = 1;
  float x = 2;
  float y = 3;
  float width = 4;
  float height = 5;
  float opacity = 6;
  int32 z = 7;
  reserved 8;
  reserved "enabled";
  uint32 transition_kind = 9;
  uint32 duration_value = 10;
  uint32 duration_unit = 11;
  bool audio_follow = 12;
  uint32 source_kind = 13;
  bool locked = 14;
  bool hidden = 15;
  bool size_linked = 16;
  float crop_x = 17;
  float crop_y = 18;
  float crop_width = 19;
  float crop_height = 20;
  uint64 id = 21;
  uint32 easing = 22;
  optional BezierHandles bezier = 23;
}

message MixingUnit {
  uint64 id = 1;
  string name = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 fps_num = 5;
  uint32 fps_den = 6;
  reserved 7, 8, 9;
  reserved "transitions", "overlays", "audio_bus_id";
  AudioLinkMode audio_link = 10;
  SwitcherSceneFilter switcher_scene_filter = 11;
  repeated uint64 switcher_scene_ids = 12;
  bool always_on_top = 13;
  uint64 preview_scene_id = 14;
  uint64 program_scene_id = 15;
  repeated uint64 overlays_on_air = 16;
  MuBus audio = 17;
}

message StreamEncoder {
  uint64 id = 1;
  string name = 2;
  OutputSourceKind source_kind = 3;
  uint64 source_id = 4;
  uint64 unit_id = 5;
  uint64 audio_unit_id = 6;
  uint32 width = 7;
  uint32 height = 8;
  uint32 fps_num = 9;
  uint32 fps_den = 10;
  uint32 video_bitrate = 11;
  uint32 audio_bitrate = 12;
  uint32 keyint = 13;
  bool video_only = 14;
  // 0 means automatic.
  uint32 encoder_threads = 15;
  // 0 sends immediately. Otherwise hold this many milliseconds, then release at 1x.
  uint32 buffer_ms = 16;
  // Empty and "OpenH264" are the only accepted encoder.
  string encoder = 17;
  // 0 low, 1 medium, 2 high.
  uint32 complexity = 18;
  uint32 ref_frames = 19;
  bool cabac = 20;
  optional bool deblock = 21;
  // Unset means on. Detection skips work on still regions, so it is the faster default.
  optional bool background_detection = 22;
  bool adaptive_quant = 23;
  bool scene_change = 24;
  uint32 audio_delay_ms = 25;
}

message Output {
  uint64 id = 1;
  string name = 2;
  OutputTransport transport = 3;
  OutputSourceKind source_kind = 4;
  uint64 source_id = 5;
  uint64 unit_id = 6;
  bool use_gpu = 7;
  bool enabled = 8;
  reserved 9;
  reserved "audio_bus_id";
  bool skip_encode_when_no_receivers = 10;
  // 0/0 follow the Mixing Unit (or session master) size and frame rate.
  uint32 width = 11;
  uint32 height = 12;
  uint32 fps_num = 13;
  uint32 fps_den = 14;
  uint64 audio_unit_id = 15;
  string decklink_device = 16;
  string decklink_mode = 17;
  bool decklink_external_key = 18;
  string rtmp_url = 19;
  string rtmp_secret_ref = 20;
  reserved 21, 22, 23, 24;
  reserved "rtmp_video_bitrate", "rtmp_audio_bitrate", "rtmp_keyint", "rtmp_video_only";
  uint64 stream_encoder_id = 25;
}

message MvSlot {
  MvSlotKind kind = 1;
  uint64 source_id = 2;
  bool label_follow = 3;
  string label = 4;
}

message Multiview {
  uint64 id = 1;
  string name = 2;
  uint64 preview_unit_id = 3;
  uint64 program_unit_id = 4;
  uint32 present_interval = 5;
  repeated MvSlot tiles = 6;
  MultiviewTemplate template = 7;
  bool preview_label_follow = 8;
  string preview_label = 9;
  bool program_label_follow = 10;
  string program_label = 11;
  optional MvLabelAnchor label_anchor = 12;
  optional float label_size = 13;
  optional MvLabelUnit label_unit = 14;
  bool always_on_top = 15;
}

message MuBus {
  AudioDeviceKind device_kind = 1;
  string device_id = 2;
  int32 map_left = 3;
  int32 map_right = 4;
  float gain = 5;
  bool mute = 6;
}

message Headphone {
  AudioDeviceKind device_kind = 1;
  string device_id = 2;
  int32 map_left = 3;
  int32 map_right = 4;
}

enum InternalColorFormat {
  INTERNAL_COLOR_FORMAT_UNSPECIFIED = 0;
  INTERNAL_COLOR_FORMAT_UYVY = 1;
  INTERNAL_COLOR_FORMAT_BGRA = 2;
}

enum MvLabelUnit {
  MV_LABEL_UNIT_UNSPECIFIED = 0;
  MV_LABEL_UNIT_PX = 1;
  MV_LABEL_UNIT_PERCENT = 2;
}

enum MvLabelAnchor {
  MV_LABEL_ANCHOR_UNSPECIFIED = 0;
  MV_LABEL_ANCHOR_TOP = 1;
  MV_LABEL_ANCHOR_BOTTOM = 2;
}

enum InputKind {
  INPUT_KIND_UNSPECIFIED = 0;
  INPUT_KIND_COLOR = 1;
  INPUT_KIND_BARS = 2;
  INPUT_KIND_BLACK = 3;
  INPUT_KIND_STILL = 4;
  INPUT_KIND_VIDEO = 5;
  INPUT_KIND_OMT = 6;
  INPUT_KIND_NDI = 7;
  INPUT_KIND_UVC = 8;
  INPUT_KIND_MIX = 9;
  INPUT_KIND_AUDIO = 10;
  INPUT_KIND_DECK_LINK = 11;
  INPUT_KIND_REPLAY = 12;
}

enum ReplayProfile {
  REPLAY_PROFILE_SQ = 0;
  REPLAY_PROFILE_HQ = 1;
  REPLAY_PROFILE_LQ = 2;
}

enum ReplayOverflow {
  REPLAY_OVERFLOW_DROP = 0;
  REPLAY_OVERFLOW_STOP = 1;
}

enum ReplayRetention {
  REPLAY_RETENTION_STOP_WHEN_FULL = 0;
  REPLAY_RETENTION_OVERWRITE = 1;
  REPLAY_RETENTION_OVERWRITE_UNPROTECTED = 2;
}

enum AngleAudio {
  ANGLE_AUDIO_SILENT = 0;
  /// The mixing unit's program mix, selected by `Angle.audio_unit_id`.
  ANGLE_AUDIO_UNIT = 1;
  /// The audio of what the angle records: its input, or the inputs in its scene.
  ANGLE_AUDIO_SOURCE = 2;
}


/// What an angle records. A scene angle records that scene's composited output; an
/// input angle records the input's own picture without composing a scene.
enum AngleSourceKind {
  ANGLE_SOURCE_KIND_SCENE = 0;
  ANGLE_SOURCE_KIND_INPUT = 1;
}

enum ClipSourceKind {
  CLIP_SOURCE_KIND_ANGLE = 0;
  CLIP_SOURCE_KIND_ASSET = 1;
}

message Replay {
  bool enabled = 1;
  repeated ReplayStorage storage = 2;
  ReplayFormat format = 3;
  ReplayBuffering buffering = 4;
  ReplayWarnings warnings = 5;
  ReplayRetention retention = 6;
  repeated Angle angles = 7;
  repeated ReplayEvent events = 8;
  repeated Playlist playlists = 9;
  repeated ReplayChannel channels = 10;
  bool auto_add_to_playlist = 11;
  uint32 next_angle_id = 12;
  uint64 next_event_id = 13;
  uint64 next_playlist_id = 14;
  uint32 active_angle_id = 15;
  bool has_active_angle = 16;
  // Absent on files written before the flag existed: playback stays ahead.
  optional bool decode_ahead = 17;
  optional bool profiling = 18;
  repeated ReplayTimelineCue timeline_cues = 19;
  repeated ReplayRecording recordings = 20;
}

message ReplayRecording {
  string uuid = 1;
  string storage = 2;
  repeated uint32 angles = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint32 fps_num = 6;
  uint32 fps_den = 7;
  uint64 first_frame = 8;
  uint64 last_frame = 9;
  uint64 created_ms = 10;
}

message ReplayTimelineCue {
  uint64 id = 1;
  uint64 frame = 2;
  uint64 scene_id = 3;
  uint64 state_id = 4;
  string clip_uid = 5;
}

message ReplayStorage {
  string path = 1;
  repeated uint32 angle_ids = 2;
}

message ReplayFormat {
  uint32 width = 1;
  uint32 height = 2;
  uint32 fps_num = 3;
  uint32 fps_den = 4;
  ReplayProfile profile = 5;
  uint32 segment_frames = 6;
}

message ReplayBuffering {
  uint32 encode_queue_frames = 1;
  uint32 write_buffer_mb = 2;
  ReplayOverflow overflow_policy = 3;
  uint32 reserve_mb = 4;
}

message ReplayWarnings {
  // Presence matters: a warning threshold of 0 is a value the operator chose, and
  // rewriting it to a default would silently change when warnings appear.
  optional uint32 remaining_warn_secs = 1;
  optional uint32 remaining_alert_secs = 2;
  optional uint32 remaining_critical_secs = 3;
}

message Angle {
  uint32 id = 1;
  string name = 2;
  uint64 scene_id = 3;
  AngleAudio audio = 4;
  reserved 5; // was AngleRecordMode (passthrough), removed.
  uint64 audio_unit_id = 6;
  /// Where this angle records from. `scene_id` is used when this is SCENE,
  /// `input_id` when it is INPUT.
  AngleSourceKind source = 7;
  uint64 input_id = 8;
  // Where this angle is encoded. GPU keeps the picture on the GPU from scene to packet.
  AngleEncoder encoder = 9;
}

message ReplayEvent {
  uint64 id = 1;
  string recording_uuid = 2;
  uint64 in_frame = 3;
  uint64 out_frame = 4;
  string name = 5;
  repeated string tags = 6;
  bool protected = 7;
}

message Clip {
  string uid = 1;
  ClipSourceKind source_kind = 2;
  uint32 angle_id = 3;
  string asset_path = 4;
  // Clips are copies: they keep their own recording, range and angle, so nothing
  // points at an event that may since have been deleted.
  reserved 5, 6;
  string recording_uuid = 7;
  uint64 in_frame = 8;
  uint64 out_frame = 9;
  float speed = 10;
  float gain_db = 11;
  ClipTransition transition = 12;
  repeated string tags = 13;
  bool preserve_pitch = 14;
  ClipAudio audio = 15;
  uint32 audio_angle_id = 16;
}

/// Which recording a clip's audio comes from.
enum ClipAudio {
  CLIP_AUDIO_FOLLOW_ANGLE = 0;
  CLIP_AUDIO_SILENT = 1;
  /// Another angle's recording, named by `Clip.audio_angle_id`.
  CLIP_AUDIO_ANGLE = 2;
}

// Where a replay angle is encoded.
enum AngleEncoder {
  ANGLE_ENCODER_CPU = 0;
  ANGLE_ENCODER_GPU = 1;
}

enum ReplayTransitionKind {
  REPLAY_TRANSITION_KIND_CUT = 0;
  REPLAY_TRANSITION_KIND_DISSOLVE = 1;
  REPLAY_TRANSITION_KIND_DIP = 2;
  REPLAY_TRANSITION_KIND_WIPE = 3;
  REPLAY_TRANSITION_KIND_SLIDE = 4;
  REPLAY_TRANSITION_KIND_PUSH = 5;
}

// Which way a Wipe, Slide or Push travels.
enum ReplayTransitionDirection {
  REPLAY_TRANSITION_DIRECTION_LEFT = 0;
  REPLAY_TRANSITION_DIRECTION_RIGHT = 1;
  REPLAY_TRANSITION_DIRECTION_UP = 2;
  REPLAY_TRANSITION_DIRECTION_DOWN = 3;
}

enum ReplayTransitionTiming {
  REPLAY_TRANSITION_TIMING_OVERWRAP = 0;
  REPLAY_TRANSITION_TIMING_ADDITIVE = 1;
}

message ClipTransition {
  ReplayTransitionKind kind = 1;
  ReplayTransitionTiming timing = 2;
  uint32 duration_frames = 3;
  ReplayTransitionDirection direction = 4;
}


message Playlist {
  uint64 id = 1;
  string name = 2;
  uint64 revision = 3;
  repeated Clip clips = 4;
  ClipTransition default_transition = 5;
}

message ReplayChannel {
  uint32 index = 1;
  uint64 playlist_id = 2;
  bool has_playlist = 3;
  uint64 input_id = 4;
}

enum MixSource {
  MIX_SOURCE_UNSPECIFIED = 0;
  MIX_SOURCE_MU_PREVIEW = 1;
  MIX_SOURCE_MU_PROGRAM = 2;
  MIX_SOURCE_SESSION_MULTIVIEW = 3;
}

enum BandwidthSave {
  BANDWIDTH_SAVE_UNSPECIFIED = 0;
  BANDWIDTH_SAVE_ALWAYS_LOW = 1;
  BANDWIDTH_SAVE_NOT_ON_PROGRAM = 2;
  BANDWIDTH_SAVE_NOT_ON_PREVIEW_OR_PROGRAM = 3;
  BANDWIDTH_SAVE_ALWAYS_FULL = 4;
}

enum OmtQuality {
  OMT_QUALITY_UNSPECIFIED = 0;
  OMT_QUALITY_DEFAULT = 1;
  OMT_QUALITY_LOW = 2;
  OMT_QUALITY_MEDIUM = 3;
  OMT_QUALITY_HIGH = 4;
}

enum NdiBandwidth {
  NDI_BANDWIDTH_UNSPECIFIED = 0;
  NDI_BANDWIDTH_HIGHEST = 1;
  NDI_BANDWIDTH_LOWEST = 2;
}

enum VideoPlayWhen {
  VIDEO_PLAY_WHEN_UNSPECIFIED = 0;
  VIDEO_PLAY_WHEN_NEVER = 1;
  VIDEO_PLAY_WHEN_ON_ACTIVE = 2;
  VIDEO_PLAY_WHEN_ON_PREVIEW = 3;
  VIDEO_PLAY_WHEN_ALWAYS = 4;
}

enum VideoTriggerWhen {
  VIDEO_TRIGGER_WHEN_UNSPECIFIED = 0;
  VIDEO_TRIGGER_WHEN_NEVER = 1;
  VIDEO_TRIGGER_WHEN_ON_ACTIVE = 2;
  VIDEO_TRIGGER_WHEN_ON_DEACTIVATED = 3;
  VIDEO_TRIGGER_WHEN_ON_PREVIEW = 4;
}

enum OutputTransport {
  OUTPUT_TRANSPORT_UNSPECIFIED = 0;
  OUTPUT_TRANSPORT_OMT = 1;
  OUTPUT_TRANSPORT_NDI = 2;
  OUTPUT_TRANSPORT_DECK_LINK = 3;
  OUTPUT_TRANSPORT_RTMP = 4;
}

enum OutputSourceKind {
  OUTPUT_SOURCE_KIND_UNSPECIFIED = 0;
  OUTPUT_SOURCE_KIND_SCENE = 1;
  OUTPUT_SOURCE_KIND_MU_PREVIEW = 2;
  OUTPUT_SOURCE_KIND_MU_PROGRAM = 3;
  OUTPUT_SOURCE_KIND_MULTIVIEW = 4;
  OUTPUT_SOURCE_KIND_INPUT = 5;
}

enum MvSlotKind {
  MV_SLOT_KIND_UNSPECIFIED = 0;
  MV_SLOT_KIND_NONE = 1;
  MV_SLOT_KIND_INPUT = 2;
  MV_SLOT_KIND_SCENE = 3;
  MV_SLOT_KIND_MU_PREVIEW = 4;
  MV_SLOT_KIND_MU_PROGRAM = 5;
}

enum MultiviewTemplate {
  MULTIVIEW_TEMPLATE_UNSPECIFIED = 0;
  MULTIVIEW_TEMPLATE_PREVIEW_PROGRAM8 = 1;
  MULTIVIEW_TEMPLATE_PREVIEW_PROGRAM8_BOTTOM = 2;
  MULTIVIEW_TEMPLATE_PREVIEW_PROGRAM8_LEFT = 3;
  MULTIVIEW_TEMPLATE_PREVIEW_PROGRAM8_RIGHT = 4;
  MULTIVIEW_TEMPLATE_PREVIEW_PROGRAM2 = 5;
  MULTIVIEW_TEMPLATE_QUAD4_TOP_LEFT = 6;
  MULTIVIEW_TEMPLATE_QUAD4_TOP_RIGHT = 7;
  MULTIVIEW_TEMPLATE_QUAD4_BOTTOM_LEFT = 8;
  MULTIVIEW_TEMPLATE_QUAD4_BOTTOM_RIGHT = 9;
  MULTIVIEW_TEMPLATE_LARGE5_TOP_LEFT = 10;
  MULTIVIEW_TEMPLATE_LARGE5_TOP_RIGHT = 11;
  MULTIVIEW_TEMPLATE_LARGE5_BOTTOM_LEFT = 12;
  MULTIVIEW_TEMPLATE_LARGE5_BOTTOM_RIGHT = 13;
  MULTIVIEW_TEMPLATE_GRID2X2 = 14;
  MULTIVIEW_TEMPLATE_GRID3X3 = 15;
  MULTIVIEW_TEMPLATE_GRID4X4 = 16;
}

enum AudioDeviceKind {
  AUDIO_DEVICE_KIND_UNSPECIFIED = 0;
  AUDIO_DEVICE_KIND_NONE = 1;
  AUDIO_DEVICE_KIND_WASAPI = 2;
  AUDIO_DEVICE_KIND_ASIO = 3;
  AUDIO_DEVICE_KIND_CORE_AUDIO = 4;
}

enum AudioCaptureMode {
  AUDIO_CAPTURE_MODE_UNSPECIFIED = 0;
  AUDIO_CAPTURE_MODE_MIC = 1;
  AUDIO_CAPTURE_MODE_ENDPOINT_LOOPBACK = 2;
  AUDIO_CAPTURE_MODE_PROCESS_LOOPBACK = 3;
}

enum AudioLinkMode {
  AUDIO_LINK_MODE_UNSPECIFIED = 0;
  AUDIO_LINK_MODE_FOLLOW = 1;
  AUDIO_LINK_MODE_INDEPENDENT = 2;
}

enum SwitcherSceneFilter {
  SWITCHER_SCENE_FILTER_UNSPECIFIED = 0;
  SWITCHER_SCENE_FILTER_ALL = 1;
  SWITCHER_SCENE_FILTER_INCLUDE = 2;
  SWITCHER_SCENE_FILTER_EXCLUDE = 3;
}
