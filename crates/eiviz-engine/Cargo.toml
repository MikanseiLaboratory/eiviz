[package]
name = "eiviz-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Composition root for sequencer, runtime, and persistence"

[dependencies]
eiviz-command.workspace = true
eiviz-codec-software.workspace = true
eiviz-core.workspace = true
eiviz-gpu = { workspace = true, optional = true }
eiviz-io-file.workspace = true
eiviz-media.workspace = true
eiviz-operations.workspace = true
eiviz-project.workspace = true
eiviz-runtime.workspace = true
eiviz-time.workspace = true
eiviz-io-stream.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
default = []
wgpu-backend = ["eiviz-runtime/wgpu-backend", "dep:eiviz-gpu"]

[dev-dependencies]
image.workspace = true
