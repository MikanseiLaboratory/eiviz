[package]
name = "eiviz_mixer"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
    crate-type = ["cdylib", "rlib"]

[features]
default = []
# Always compiled. Kept so older `cargo build --features control-api` still works.
control-api = []

[dependencies]
eiviz-control.workspace = true
eiviz-api.workspace = true
tokio.workspace = true
bytemuck = { version = "1.25", features = ["derive"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
openmediatransport = { git = "https://github.com/MikanseiLaboratory/openmediatransport-rs", rev = "2e57ca89e0af4ca9f4e9642c72f26c0d0b1eef64", features = ["wgpu"] }
pollster = "0.4"
raw-window-handle = "0.6"
base64 = "0.22"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tiny_http = "0.12"
vmix-core = { git = "https://github.com/MikanseiLaboratory/vmix-rs", features = ["xml", "std"] }
vmx = { git = "https://github.com/MikanseiLaboratory/vmx-rs", rev = "e6cccd45bf6bb0fb6b0617ccc55c74ea4a03c657" }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "parking_lot"] }
naga = { version = "30.0.1", default-features = false, features = ["wgsl-in"] }

[target.'cfg(windows)'.dependencies]
ash = "0.38"
cpal = { version = "0.18.2", features = ["asio"] }
grafton-ndi = { version = "1.0", default-features = false }
rsac = { git = "https://github.com/Codeseys-Labs/rust-crossplat-audio-capture", rev = "eac70568d0cde68c64572a57f4f184889273c872", default-features = false, features = ["feat_windows"] }
gpu-video = { git = "https://github.com/software-mansion/smelter", rev = "604595d04f1fa88d4dcb55facb2604ce98d660c9" }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "parking_lot", "dx12", "vulkan"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D11on12", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_Devices_FunctionDiscovery", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem"] }
windows-core = "0.62.2"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18.2"
dispatch2 = "0.3"
grafton-ndi = { version = "1.0", default-features = false }
objc2 = "0.6.4"
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture", "MTLTypes"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "parking_lot", "metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"
gpu-video = { git = "https://github.com/software-mansion/smelter", rev = "604595d04f1fa88d4dcb55facb2604ce98d660c9" }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "parking_lot", "vulkan"] }

[build-dependencies]
cc = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
serial_test = "3"
