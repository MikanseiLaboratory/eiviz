[workspace]
members = [
    "crates/eiviz-mixer",
    "crates/eiviz-control",
    "crates/eiviz-api",
    "crates/eiviz-remote",
    "crates/eiviz-pro-api",
    "crates/eiviz-replay",
    "crates/eiviz-pro-test-plugin",
    "crates/eiviz-pro-empty-plugin",
    "hosts/headless",
]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.97"
authors = ["Shugo Kawamura", "Mikansei Laboratory"]
license = "PolyForm-Shield-1.0.0"

[workspace.dependencies]
eiviz-control = { path = "crates/eiviz-control" }
eiviz-api = { path = "crates/eiviz-api" }
eiviz_remote = { path = "crates/eiviz-remote" }
eiviz_mixer = { path = "crates/eiviz-mixer" }
eiviz-pro-api = { path = "crates/eiviz-pro-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tokio-tungstenite = "0.26"
prost = "0.13"
prost-types = "0.13"
clap = { version = "4", features = ["derive", "env"] }
tiny_http = "0.12"

# Cargo's release default is `-Wl,-S` (strip = "debuginfo"). Xcode 27's ld emits
# dylibs that it then refuses to read back ("mis-aligned LINKEDIT string pool") when
# both the deployment target is below the SDK (14.0 here) and that flag is present.
# That broke the Pro test plugin under `cargo test` and the two dylibs build.sh links.
# Release builds of this workspace carry no debug info anyway, so leaving the symbol
# table alone costs a few percent of size and keeps every macOS toolchain happy.
[profile.release]
strip = "none"

[profile.dev.package.eiviz-control]
opt-level = 1

[profile.test.package.eiviz-control]
opt-level = 1

# Codec / transport hot-path work that has not shipped to crates.io yet.
# - vmx:         MikanseiLaboratory/vmx-rs#37 (decode/encode hot paths)
# - openmediatransport: MikanseiLaboratory/openmediatransport-rs#50 (receive hot path)
# Patch (not a per-crate dependency) so the mixer and openmediatransport resolve
# the *same* vmx instance: two vmx copies would each build their own rayon pool
# and the optimized decode would not be the one actually used.
# Pinned by commit (not by branch) so CI builds exactly the revisions this branch
# was measured against. Once both PRs merge and are published, delete this section,
# bump the versions to the published ones, and drop the patch entirely.
[patch.crates-io]
vmx = { git = "https://github.com/MikanseiLaboratory/vmx-rs", rev = "aed8aeece63fb38e313c1c516a295547672e9099" }
openmediatransport = { git = "https://github.com/MikanseiLaboratory/openmediatransport-rs", rev = "ef499c4323d19da1e24fb039552af6891c240a8b" }
